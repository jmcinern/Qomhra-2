# @package _global_
# ^ required: this config sits in a subdirectory, and without it Hydra would
#   namespace every key under `legacy.` instead of the top level.
# Ablation 2 — "Just Speech": audio only, train everything.
#
# Speech goes through Omni's native audio path (mel -> audio_tower -> 2048-d @ 25 Hz),
# and the objective is next-audio-frame regression against the *detached* encoder
# output (see model.py). The whole stack trains: audio encoder + adapter + LLM +
# lm_head + the regression head.
defaults:
  # Absolute (leading /): this config now lives in legacy/, and a bare `base`
  # would resolve to legacy/base.yaml, which does not exist.
  - /base
  - _self_

model:
  # base.yaml defaults this to false, which is correct ONLY for text. The audio
  # branches pin eager attention (the tower NaNs under SDPA — model.py::
  # _eager_attention), so they get nothing from the fused kernel and still pay full
  # score matrices. Measured: without checkpointing this run peaks at ~61 of 64 GiB and
  # then dies in NCCL with "Failed to CUDA host alloc" — a host-side error that does not
  # look like a GPU OOM at all.
  gradient_checkpointing: true

task:
  modality: speech
  audio_loss: cosine
  # `detach` COLLAPSES: measured over 40 steps, the encoder drives its own output
  # variance 0.43 -> 0.048 and the loss follows it to 0.09 — it is flattening the
  # targets until they are trivially predictable, not learning to predict. A stop-grad
  # on the target alone cannot prevent this, because the encoder still sits upstream
  # of the prediction. Against a separate target encoder the variance holds flat
  # (0.43 -> 0.46) while the loss falls 1.00 -> 0.56 — the objective doing real work.
  #
  # `frozen` (the pretrained tower, never updated) rather than `ema`: it cannot collapse
  # by construction, and it avoids all-gathering the sharded live tower every step. At
  # ema_decay=0.999 the two are near-identical over a few hundred steps anyway.
  target_detach: frozen

freeze:
  mode: all

data:
  source: audio
  audio_micro_batch_size: 2

logging:
  wandb_run_name: ablation-speech

# @package _global_
# ^ required: this config sits in a subdirectory, and without it Hydra would
#   namespace every key under `legacy.` instead of the top level.
# Ablation 4 — final 10% continuation with 10% aligned-ASR optimizer steps.
#
# Resume from ablation 3's 90%-epoch checkpoint. The finite loaders reproduce the
# same seeded corpus order and expose only its final 10%. All remaining original
# text/audio steps are retained; aligned steps are added so they form 10% of this
# phase rather than replacing original corpus data.
defaults:
  # Absolute (leading /): this config now lives in legacy/, and a bare `base`
  # would resolve to legacy/base.yaml, which does not exist.
  - /base
  - _self_

task:
  modality: continuation
  aligned_step_frac: 0.10

freeze:
  mode: all

model:
  # Required: model.init_from=<ablation-3-run>/checkpoints/step_<90-percent>
  init_from: null
  gradient_checkpointing: true

data:
  source: continuation
  epoch_start: 0.90
  epoch_end: 1.0
  text_bin:
    - ${paths.tokens}/shards/hplt3_mono__rg*.bin
    - ${paths.tokens}/shards/finepdfs__rg*.bin
    - ${paths.tokens}/shards/corpas_full_clean__rg*.bin
    - ${paths.tokens}/shards/nce__rg*.bin
    - ${paths.tokens}/shards/uni-archives__rg*.bin
    - ${paths.tokens}/shards/oireachtas_ga__rg*.bin
    - ${paths.tokens}/shards/conversations_capr__rg*.bin
  aligned_parquet: /scratch/project_465002364/Denorm/train/data/supervised_ASR.parquet
  aligned_root: null               # parquet paths are already absolute on LUMI
  aligned_micro_batch_size: 4

optim:
  lr: 2.0e-5
  warmup_fraction: 0.05

logging:
  wandb_run_name: ablation-aligned-10pct

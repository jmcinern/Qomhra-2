# Qomhra training-time estimate — default config.
# Quick first number: random-init Qwen3-8B on synthetic random tokens, 8-GCD FSDP.
seed: 2137
precision: bf16            # accelerate mixed precision (FSDP param dtype = bf16)

model:
  # Qwen3-8B architecture (explicit so the run is fully offline — no config download).
  hidden_size: 4096
  intermediate_size: 12288
  num_hidden_layers: 36
  num_attention_heads: 32
  num_key_value_heads: 8
  head_dim: 128
  max_position_embeddings: 40960
  rms_norm_eps: 1.0e-6
  rope_theta: 1000000.0
  tie_word_embeddings: false
  attn_implementation: sdpa        # ROCm-safe; flash-attn optional later
  # Force SDPA backend priority (excludes the slow math bmm+softmax path). null =
  # torch default. Profiler showed the math backend (explicit O(seq^2) bmm+softmax)
  # was being used; [flash, efficient] forces the fused kernels. If the model's 4D
  # mask makes both ineligible the forward errors — that tells us the mask is the
  # blocker (then drop to [efficient] or [flash, efficient, math]).
  sdpa_backends: null              # e.g. [flash, efficient]
  gradient_checkpointing: true
  # Liger fused kernels (RMSNorm/RoPE/SwiGLU + fused linear cross-entropy). The
  # fused CE skips materialising the 152,960-vocab logits -> frees ~10 GB and folds
  # LM-head+loss into one kernel. Needs liger-kernel in the overlay.
  use_liger: false
  # torch.compile the FSDP-wrapped model (A/B; can be fragile on ROCm).
  compile: false
  # Combined vocab: Qwen3 text + mHuBERT audio units + a few specials, padded.
  text_vocab: 151936               # Qwen3-8B native vocab
  audio_vocab: 1000                # mHuBERT-147 units [0, 1000)
  num_special: 8                   # audio-BOS/EOS, modality-switch, headroom
  pad_vocab_to_multiple_of: 128

data:
  seq_len: 4096
  micro_batch_size: 1              # per-GCD; raise if memory allows
  source: synthetic                # synthetic (random ids) | real (LUMI tokens)
  # --- real-data source (already-tokenized files on LUMI; no tokenization here) ---
  text_bin: /scratch/project_465002364/Qomhra-2/full-train-est/tokens/throughput_100k/sample.bin
  text_token_budget: null          # null = use the whole text subset
  sep_id: 151643                   # Qwen3 eod, separates docs in text_bin
  audio_units_dir: /scratch/project_465002364/Qomhra-2/full-train-est/mhubert/units
  audio_token_budget: 180000       # ~1 h of audio at 50 Hz mHuBERT (180k tok/h)
  audio_offset: 151936             # combined-vocab offset for audio units (= text_vocab)

optim:
  lr: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  grad_acc: 8                      # global batch = micro_bs * world_size * grad_acc
  total_steps: 400
  warmup_steps: 20
  scheduler: cosine
  final_lr_frac: 0.1

fsdp:
  # Overlap the next layer's param all-gather with the current layer's forward
  # compute. Profiler showed ~23% of CUDA time in exposed nccl all-gather.
  forward_prefetch: true
  # full_shard (ZeRO-3 across ALL ranks) | hybrid_shard (shard within a node over
  # Infinity Fabric, replicate across nodes). On 8 nodes full_shard all-gathers
  # every layer across all 64 GCDs over Slingshot (measured 64% scaling eff);
  # hybrid_shard keeps the per-layer all-gathers node-local and only does one grad
  # all-reduce/step across nodes. Single node: the two are identical (1 node = 1
  # shard group). FSDP1 auto-builds the intra/inter-node groups for HYBRID_SHARD.
  sharding_strategy: full_shard
  # Gradient reduction dtype: fp32 (safe default) | bf16 (halves inter-node
  # all-reduce volume, small numerical-stability cost).
  reduce_dtype: fp32

logging:
  wandb: true
  wandb_project: qomhra-train-est
  wandb_run_name: null
  every_steps: 10

# Optional torch profiler over a short early window of micro-batches (rank 0 only).
# Writes a chrome trace (*.pt.trace.json) to <run-dir>/profiler for Perfetto.
#   python -m qomhra.main profile.enabled=true optim.total_steps=30
profile:
  enabled: false
  wait: 5
  warmup: 3
  active: 10

hydra:
  job:
    chdir: true
